workflows:
  android-apk:
    name: Pomdo Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Install Gradle 8.7
        script: |
          set -e
          curl -fL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --version

      - name: Build debug APK
        script: |
          set -e
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
